<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas - AI Desktop Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h1>Atlas</h1>
        <p>AI Desktop Assistant</p>
        <p id="status">Loading...</p>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // Listen for errors during initialization
        ipcRenderer.on('init-error', (event, error) => {
            const errorDiv = document.getElementById('error');
            const statusDiv = document.getElementById('status');

            errorDiv.textContent = `Error: ${error}`;
            errorDiv.style.display = 'block';
            statusDiv.textContent = 'Failed to initialize';
        });

        // Listen for successful initialization
        ipcRenderer.on('init-success', (event) => {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = 'Ready!';
        });

        // Request initialization status
        ipcRenderer.invoke('get-init-status').then(status => {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = status;
        }).catch(error => {
            const errorDiv = document.getElementById('error');
            const statusDiv = document.getElementById('status');

            errorDiv.textContent = `Error: ${error.message}`;
            errorDiv.style.display = 'block';
            statusDiv.textContent = 'Failed to initialize';
        });
    </script>
</body>
</html>
